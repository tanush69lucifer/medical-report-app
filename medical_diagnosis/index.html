<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Mediosis - AI Medical Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.63.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/browser@0.63.1/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: ["opencv-python", "pillow", "easyocr", "fpdf"], 
        entrypoint: "medical_diagnosis/app.py",
        files: {
          "medical_diagnosis/app.py": { url: "medical_diagnosis/app.py" },
          "medical_diagnosis/ocr_utils.py": { url: "medical_diagnosis/ocr_utils.py" },
          "medical_diagnosis/parser.py": { url: "medical_diagnosis/parser.py" }
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
